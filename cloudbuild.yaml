steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:latest'
      - '.'

  # 2. Artifact Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app'

  # 3. Migration 이미지 빌드 & 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.migrate'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/migrate:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/migrate:latest'

  # 4. Prisma migrate deploy (Cloud Run Job)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'prisma-migrate'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/migrate:latest'
      - '--region'
      - 'asia-northeast3'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'prisma-migrate'
      - '--region'
      - 'asia-northeast3'
      - '--wait'

  # 5. Cloud Run 배포 (Cloud SQL 소켓 연결 포함)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lawyer-agent'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--add-cloudsql-instances'
      - 'lawyer-ai-agent-489501:asia-northeast3:lawyer-agent-db'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - >-
        NEXTAUTH_URL=NEXTAUTH_URL:latest,
        AUTH_SECRET=AUTH_SECRET:latest,
        DATABASE_URL=DATABASE_URL:latest,
        OPENAI_API_KEY=OPENAI_API_KEY:latest

images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:$COMMIT_SHA'
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:latest'

options:
  logging: LEGACY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
