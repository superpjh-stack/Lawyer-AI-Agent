steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:latest'
      - '.'

  # 2. Artifact Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app'

  # 3. Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lawyer-agent'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - >-
        NODE_ENV=production,
        NEXTAUTH_URL=$$NEXTAUTH_URL,
        AUTH_SECRET=$$AUTH_SECRET,
        DATABASE_URL=$$DATABASE_URL,
        OPENAI_API_KEY=$$OPENAI_API_KEY
      - '--set-secrets'
      - >-
        NEXTAUTH_URL=NEXTAUTH_URL:latest,
        AUTH_SECRET=AUTH_SECRET:latest,
        DATABASE_URL=DATABASE_URL:latest,
        OPENAI_API_KEY=OPENAI_API_KEY:latest

images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:$COMMIT_SHA'
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/lawyer-agent/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
