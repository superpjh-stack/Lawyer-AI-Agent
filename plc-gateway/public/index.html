<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>임진강김치 PLC Data Gateway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="dashboard.css">
<!--
  =====================================================================
   실시간 대시보드 (WebSocket)
   - 접속 직후 snapshot(태그 정의 + 최근 이력 + 활성 알람)으로 화면을 구성하고
     이후 매 초 sample / alarm / plc 메시지로 갱신합니다.
   - 화면 구성은 dashboard.js 가 태그 정의로부터 자동 생성합니다.
  =====================================================================
-->
</head>
<body>
<div class="top">
  <div>
    <h1>임진강김치 PLC Data Gateway</h1>
    <div class="sub" id="subtitle">PLC Master/Slave · Modbus TCP · 1초 주기 수집</div>
  </div>
  <div class="badges">
    <span id="wsBadge" class="badge"><span class="dot"></span>Gateway</span>
    <span id="plcBadge" class="badge"><span class="dot"></span>PLC</span>
    <span id="seqInfo" class="badge mono">seq -</span>
  </div>
</div>

<main>
  <div class="section-title">현재값 · 공정별</div>
  <div id="kpiRoot"></div>
  <div class="section-title">추이 · 최근 5분</div>
  <div class="charts" id="chartRoot"></div>
  <section class="bottom">
    <div class="panel">
      <header><h2>알람 이벤트</h2><span class="count" id="alarmCount">0건</span></header>
      <div class="body">
        <table>
          <thead><tr><th>시각</th><th>태그</th><th>종류</th><th>상태</th><th class="n">값</th></tr></thead>
          <tbody id="alarmBody"></tbody>
        </table>
        <div class="empty" id="alarmEmpty">알람 없음</div>
      </div>
    </div>
    <div class="panel">
      <header><h2>수집 데이터</h2><span class="count" id="tableCount">-</span></header>
      <div class="body">
        <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
      </div>
    </div>
  </section>
</main>
<footer id="footer">PLC 데이터 게이트웨이 실시간 화면. 품질 BAD 샘플은 통신 장애 구간을 의미합니다.</footer>
<div class="tip" id="tip" hidden></div>

<script src="dashboard.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var apiKey = new URLSearchParams(location.search).get('apiKey');
  var dash = null;

  function setBadge(id, ok, text) { var el = $(id); el.className = 'badge ' + (ok ? 'ok' : 'bad'); el.innerHTML = '<span class="dot"></span>' + text; }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var ws = new WebSocket(proto + '://' + location.host + '/ws' + (apiKey ? '?apiKey=' + encodeURIComponent(apiKey) : ''));
    ws.onopen = function () { setBadge('wsBadge', true, 'Gateway 연결됨'); };
    ws.onclose = function () { setBadge('wsBadge', false, 'Gateway 끊김'); setTimeout(connect, 2000); };
    ws.onerror = function () { ws.close(); };
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.type === 'snapshot') {
        // 태그 정의가 바뀌었을 수 있으므로 스냅샷마다 대시보드를 새로 구성
        dash = PlcDashboard.create({ tags: msg.tags, maxPoints: 300 });
        dash.setHistory(msg.history || []);
        dash.setAlarms((msg.activeAlarms || []).slice().reverse(), msg.activeAlarms || []);
        setBadge('plcBadge', msg.plcConnected, msg.plcConnected ? 'PLC 연결됨' : 'PLC 끊김');
        $('subtitle').textContent = '태그 ' + msg.tags.length + '개 · 1초 주기 수집' + (msg.latest ? ' · 마지막 ' + PlcDashboard.fmtTime(msg.latest.ts) + ' UTC' : '');
        if (msg.latest) $('seqInfo').textContent = 'seq ' + msg.latest.seq;
        dash.render();
      } else if (!dash) {
        return;
      } else if (msg.type === 'sample') {
        dash.push(msg.sample);
        $('seqInfo').textContent = 'seq ' + msg.sample.seq + (msg.sample.quality !== 'GOOD' ? ' · BAD' : '');
        dash.render();
      } else if (msg.type === 'alarm') {
        dash.pushAlarm(msg.alarm);
        dash.render();
      } else if (msg.type === 'plc') {
        setBadge('plcBadge', msg.connected, msg.connected ? 'PLC 연결됨' : 'PLC 끊김' + (msg.reason ? ' (' + msg.reason + ')' : ''));
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
