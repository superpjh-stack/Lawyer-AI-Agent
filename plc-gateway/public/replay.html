<title>임진강김치 PLC 리플레이</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="dashboard.css">
<!--
  =====================================================================
   PLC 샘플 리플레이 대시보드 (태그 정의 기반)
   - 시뮬레이터로 생성한 N건(1초 간격) 샘플을 1초에 1개씩 재생합니다.
   - 데이터 소스: window.__PLC_SAMPLES__ (인라인 주입) 또는 samples/sample-<N>.json (fetch)
     N 은 URL 의 ?sample=<N> 으로 지정 (기본 500)
   - 화면 구성(KPI/차트/표)은 dashboard.js 가 태그 정의로부터 자동 생성합니다.
  =====================================================================
-->
<div class="top">
  <div>
    <h1>임진강김치 PLC 리플레이</h1>
    <div class="sub" id="subtitle">시뮬레이터 생성 데이터 · 1초 간격 · PLC Master/Slave 수집 항목</div>
  </div>
  <div class="transport">
    <div class="progress">
      <span class="mono" id="progressText">0 / -</span>
      <div class="track" aria-hidden="true"><i id="progressBar"></i></div>
    </div>
    <button class="btn" id="btnRestart" title="처음부터">⟲ 처음</button>
    <button class="btn primary" id="btnPlay" aria-pressed="true">❚❚ 일시정지</button>
    <button class="btn" id="btnEnd" title="전체 데이터 보기">끝으로 ⇥</button>
    <div class="seg" role="group" aria-label="재생 속도">
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="5" aria-pressed="false">5×</button>
      <button data-speed="20" aria-pressed="false">20×</button>
    </div>
  </div>
</div>

<main>
  <div class="section-title">현재값 · 공정별</div>
  <div id="kpiRoot"></div>
  <div class="section-title">추이 · 최근 5분</div>
  <div class="charts" id="chartRoot"></div>
  <section class="bottom">
    <div class="panel">
      <header><h2>알람 이벤트</h2><span class="count" id="alarmCount">0건</span></header>
      <div class="body">
        <table>
          <thead><tr><th>시각</th><th>태그</th><th>종류</th><th>상태</th><th class="n">값</th></tr></thead>
          <tbody id="alarmBody"></tbody>
        </table>
        <div class="empty" id="alarmEmpty">아직 발생한 알람이 없습니다.</div>
      </div>
    </div>
    <div class="panel">
      <header><h2>샘플 데이터</h2><span class="count" id="tableCount">-</span></header>
      <div class="body">
        <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
      </div>
    </div>
  </section>
</main>
<footer>데이터는 plc-gateway 시뮬레이터 드라이버로 생성한 예시 값이며 실제 설비 측정값이 아닙니다. 알람 기준은 사업계획서·MES CCP 기준을 참고한 초안입니다.</footer>
<div class="tip" id="tip" hidden></div>

<script src="dashboard.js"></script>
<script>
/**
 * 리플레이 제어
 *  - 1초(÷속도)마다 cursor 를 1 증가시켜 대시보드에 샘플을 push
 *  - 알람은 AlarmTracker(게이트웨이와 동일 규칙)로 재계산
 */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var data = null, dash = null, tracker = null;
  var cursor = 0, playing = true, speed = 1, timer = null;

  function load() {
    if (window.__PLC_SAMPLES__) return Promise.resolve(window.__PLC_SAMPLES__);
    var n = parseInt(new URLSearchParams(location.search).get('sample') || '500', 10) || 500;
    return fetch('samples/sample-' + n + '.json').then(function (r) {
      if (!r.ok) throw new Error('샘플 파일을 불러오지 못했습니다 (' + r.status + ')');
      return r.json();
    });
  }

  load().then(function (d) {
    data = d;
    var n = d.samples.length;
    $('subtitle').textContent = '시뮬레이터 생성 데이터 · 1초 간격 ' + n + '건 · 태그 ' + d.tags.length + '개 · ' +
      PlcDashboard.fmtTime(d.samples[0].ts) + ' ~ ' + PlcDashboard.fmtTime(d.samples[n - 1].ts) + ' (UTC)';
    dash = PlcDashboard.create({ tags: d.tags, maxPoints: 300 });
    tracker = PlcDashboard.AlarmTracker(d.tags);
    seek(1);
    schedule();
  }).catch(function (err) { $('subtitle').textContent = String(err.message || err); });

  function schedule() {
    clearInterval(timer);
    if (!playing) return;
    timer = setInterval(function () {
      if (cursor >= data.samples.length) { setPlaying(false); return; }
      seek(cursor + 1);
    }, 1000 / speed);
  }
  function setPlaying(p) {
    playing = p;
    var b = $('btnPlay'); b.textContent = p ? '❚❚ 일시정지' : '▶ 재생'; b.setAttribute('aria-pressed', String(p));
    schedule();
  }
  /** cursor 를 to 로 이동. 뒤로 가면 처음부터 다시 재생성 */
  function seek(to) {
    if (to < cursor) { cursor = 0; tracker.reset(); dash.setHistory([]); dash.setAlarms([], []); }
    var evts = [];
    while (cursor < to) {
      cursor += 1;
      var s = data.samples[cursor - 1];
      dash.push(s);
      tracker.evaluate(s).forEach(function (a) { evts.push(a); });
    }
    evts.forEach(function (a) { dash.pushAlarm(a); });
    var n = data.samples.length;
    $('progressText').textContent = cursor + ' / ' + n;
    $('progressBar').style.width = (cursor / n * 100) + '%';
    dash.render();
  }

  $('btnPlay').addEventListener('click', function () { if (!playing && cursor >= data.samples.length) seek(1); setPlaying(!playing); });
  $('btnRestart').addEventListener('click', function () { seek(1); setPlaying(true); });
  $('btnEnd').addEventListener('click', function () { seek(data.samples.length); setPlaying(false); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () {
      speed = Number(b.dataset.speed);
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      schedule();
    });
  });
  document.addEventListener('keydown', function (e) { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('btnPlay').click(); } });
})();
</script>
