<style>
/* =====================================================================
   PLC Data Gateway 대시보드 공통 스타일 (index.html / replay.html 공용)
   - 태그 정의 기반 KPI 카드, 그룹별 차트, 알람 로그, 샘플 표
   - 테마: 라이트/다크/시스템 3상태 모두 토큰으로 대응
   - 시리즈 색상 4종은 dataviz 검증(CVD/명도/대비) 통과 값
   ===================================================================== */

/* ---- 토큰: 라이트 (기본) ---- */
:root {
  --bg: #F2F4F3; --panel: #FFFFFF; --panel-2: #E9EDEC; --line: #D5DBD9; --grid: #E3E8E6;
  --ink: #1A2328; --ink-2: #5C6B73; --ink-3: #8C9AA2;
  --s1: #D9632B; --s2: #2F6FA8; --s3: #2A8A5B; --s4: #7B5EA7;
  --good: #2A8A5B; --good-soft: rgba(42, 138, 91, 0.14);
  --crit: #C33A3A; --crit-soft: rgba(195, 58, 58, 0.14);
  --warn: #B8860B; --warn-soft: rgba(184, 134, 11, 0.14);
  --focus: #2F6FA8; --shadow: 0 1px 2px rgba(20, 30, 35, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1518; --panel: #171F24; --panel-2: #1F2A30; --line: #2B373E; --grid: #223038;
    --ink: #E4EAED; --ink-2: #8A9AA4; --ink-3: #62727C;
    --s1: #E06A2A; --s2: #3D8FD6; --s3: #3FA46F; --s4: #9B7FC4;
    --good: #3FA46F; --good-soft: rgba(63, 164, 111, 0.18);
    --crit: #E05252; --crit-soft: rgba(224, 82, 82, 0.18);
    --warn: #D4A017; --warn-soft: rgba(212, 160, 23, 0.18);
    --focus: #3D8FD6; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1518; --panel: #171F24; --panel-2: #1F2A30; --line: #2B373E; --grid: #223038;
  --ink: #E4EAED; --ink-2: #8A9AA4; --ink-3: #62727C;
  --s1: #E06A2A; --s2: #3D8FD6; --s3: #3FA46F; --s4: #9B7FC4;
  --good: #3FA46F; --good-soft: rgba(63, 164, 111, 0.18);
  --crit: #E05252; --crit-soft: rgba(224, 82, 82, 0.18);
  --warn: #D4A017; --warn-soft: rgba(212, 160, 23, 0.18);
  --focus: #3D8FD6; --shadow: none;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "IBM Plex Sans", "Noto Sans KR", system-ui, sans-serif; }
.mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: "Barlow", "IBM Plex Sans", system-ui, sans-serif; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- 상단 바 ---- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
.top .sub { color: var(--ink-2); font-size: 12px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--ink-2); }
.badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.badge.ok .dot { background: var(--good); } .badge.bad .dot { background: var(--crit); }
.transport { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { height: 32px; padding: 0 10px; border: 0; background: transparent; cursor: pointer; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.progress { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.track { flex: 1; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.track > i { display: block; height: 100%; width: 0%; background: var(--ink); transition: width 0.3s linear; }
@media (prefers-reduced-motion: reduce) { .track > i { transition: none; } }

/* ---- 본문 ---- */
main { padding: 20px 24px 32px; display: grid; gap: 16px; max-width: 1400px; margin: 0 auto; }
main > * { min-width: 0; }
.section-title { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin: 4px 0 -6px; }

/* KPI 카드: 공정별 묶음 */
.process-block { display: grid; gap: 8px; }
.process-name { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 3px; border-left: 3px solid var(--line); }
.kpi .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi .label i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; background: var(--ink-3); }
.kpi .num { font-size: 26px; line-height: 1.1; font-weight: 500; }
.kpi .num small { font-size: 12px; color: var(--ink-2); margin-left: 4px; font-weight: 400; }
.kpi .foot { font-size: 11px; color: var(--ink-3); }
.kpi.alarm-active { border-color: var(--crit); border-left-color: var(--crit); background: var(--crit-soft); }
.kpi.bad .num { color: var(--ink-3); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.off { background: var(--panel-2); color: var(--ink-2); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* 차트 */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 6px; box-shadow: var(--shadow); min-width: 0; }
.chart header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.chart h2 { font-size: 14px; font-weight: 600; }
.chart .unit { color: var(--ink-2); font-size: 12px; }
.chart .legend { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); }
.chart .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.chart svg { width: 100%; height: 190px; display: block; overflow: visible; touch-action: pan-y; }
.chart .axis text { fill: var(--ink-2); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; }
.chart .thr line { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 4 4; }
.chart .thr text { fill: var(--crit); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .end { stroke: var(--panel); stroke-width: 2; }
.chart .dlabel { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 10px; }
.chart .cross line { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .cross circle { stroke: var(--panel); stroke-width: 2; }
.chart .alarm-band { fill: var(--crit-soft); }
.tip { position: fixed; pointer-events: none; z-index: 10; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.2); line-height: 1.4; }
.tip[hidden] { display: none; }

/* 하단 표 */
.bottom { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 900px) { .bottom { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
.panel header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel h2 { font-size: 15px; font-weight: 600; }
.panel header .count { margin-left: auto; color: var(--ink-2); font-size: 12px; }
.panel .body { padding: 0; overflow: auto; max-height: 360px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--panel-2); color: var(--ink-2); font-weight: 500; font-size: 12px; }
td.n, th.n { text-align: right; }
tr.current td { background: var(--panel-2); font-weight: 500; }
tr.bad td { color: var(--ink-3); }
.empty { padding: 20px 16px; color: var(--ink-2); font-size: 13px; }
.lvl { font-weight: 600; } .lvl.HIGH { color: var(--crit); } .lvl.LOW { color: var(--warn); }
.ev-CLEARED td { color: var(--ink-2); }
footer { color: var(--ink-3); font-size: 12px; padding: 0 24px 24px; max-width: 1400px; margin: 0 auto; }

/* ---- 모바일 ---- */
@media (max-width: 640px) {
  .top { padding: 12px 16px; gap: 10px; }
  .top h1 { font-size: 18px; }
  .top .sub { font-size: 11px; }
  .transport { margin-left: 0; width: 100%; flex-wrap: wrap; gap: 8px; }
  .progress { width: 100%; min-width: 0; order: -1; }
  .btn, .seg button { height: 40px; }
  .btn.primary { flex: 1; justify-content: center; }
  .seg { flex-basis: 100%; display: flex; }
  .seg button { flex: 1; }
  main { padding: 14px 12px 24px; gap: 12px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .num { font-size: 22px; }
  .charts { grid-template-columns: minmax(0, 1fr); }
  .chart svg { height: 170px; }
  .panel .body { max-height: 300px; }
  th, td { padding: 8px 10px; font-size: 12px; }
  footer { padding: 0 16px 24px; }
}

</style>
<!--
  =====================================================================
   PLC 샘플 리플레이 대시보드 (태그 정의 기반)

   - 화면 구성(KPI/차트/표)은 dashboard.js 가 태그 정의로부터 자동 생성합니다.

-->
<div class="top">

<footer>데이터는 plc-gateway 시뮬레이터 드라이버로 생성한 예시 값이며 실제 설비 측정값이 아닙니다. 알람 기준은 사업계획서·MES CCP 기준을 참고한 초안입니다.</footer>

<script>
/**
 * =====================================================================
 *  PLC Data Gateway 대시보드 렌더러 (index.html / replay.html 공용)
 * =====================================================================
 *
 *  서버의 태그 정의(publicTag 형식)를 받아 화면을 **데이터 기반으로** 구성합니다.
 *  태그를 추가/변경해도 이 파일을 고칠 필요가 없습니다.
 *
 *   - KPI 카드 : 태그마다 1장. 공정(process) 별로 묶어 표시
 *                analog → 값+단위, digital → 상태 pill, counter → 누적 수량
 *   - 차트     : 태그의 group 별로 1개. 같은 group 의 analog/counter 태그를 한 차트에
 *                (최대 4 시리즈, 직접 라벨 + 범례). digital 은 차트 대신 pill 로만 표시
 *   - 알람 로그: 발생/해제 이벤트 (최신이 위)
 *   - 샘플 표  : 최근 N행, 열 = 모든 태그
 *
 *  사용법
 *    const dash = PlcDashboard.create({ root: document, tags, maxPoints: 300 });
 *    dash.setHistory(samples);      // 이력 전체 교체 (오래된 → 최신)
 *    dash.push(sample);             // 샘플 1건 추가
 *    dash.setAlarms(events, active) // 알람 이력/활성 교체
 *    dash.pushAlarm(alarm);         // 알람 이벤트 추가
 *    dash.render();                 // 전체 다시 그림
 *
 *  알람 재계산이 필요한 경우(리플레이) AlarmTracker 를 사용합니다:
 *    const tr = PlcDashboard.AlarmTracker(tags); tr.evaluate(sample) → 이벤트 배열
 * =====================================================================
 */
(function (global) {
  'use strict';

  var SERIES_VARS = ['--s1', '--s2', '--s3', '--s4'];
  var TABLE_ROWS = 100;

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function fmtTime(iso) { return iso.slice(11, 19); }
  function fmt(v, d) { return v === null || v === undefined ? '--' : Number(v).toFixed(d); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ------------------------------------------------------------------
   *  AlarmTracker: 게이트웨이 AlarmEngine 과 동일한 히스테리시스 규칙
   * ------------------------------------------------------------------ */
  function AlarmTracker(tags) {
    var active = {}; // key tag:level → alarm
    function transition(events, tag, level, value, threshold, ts, raise, clear) {
      var key = tag + ':' + level, ex = active[key];
      if (!ex && raise) {
        active[key] = { tag: tag, level: level, state: 'ACTIVE', value: value, threshold: threshold, raisedAt: ts };
        events.push(active[key]);
      } else if (ex && clear) {
        delete active[key];
        events.push({ tag: tag, level: level, state: 'CLEARED', value: value, threshold: threshold, raisedAt: ex.raisedAt, clearedAt: ts });
      }
    }
    return {
      /** 샘플 1건 평가 → 발생/해제 이벤트 배열 */
      evaluate: function (s) {
        var events = [];
        if (s.quality !== 'GOOD') return events;
        tags.forEach(function (t) {
          var v = s.values[t.name]; if (v === null || v === undefined || !t.alarm) return;
          var a = t.alarm;
          if (a.high !== null && a.high !== undefined) transition(events, t.name, 'HIGH', v, a.high, s.ts, v > a.high, v <= a.high - a.hysteresis);
          if (a.low !== null && a.low !== undefined) transition(events, t.name, 'LOW', v, a.low, s.ts, v < a.low, v >= a.low + a.hysteresis);
        });
        return events;
      },
      getActive: function () { return Object.keys(active).map(function (k) { return active[k]; }); },
      reset: function () { active = {}; },
    };
  }

  /* ------------------------------------------------------------------
   *  대시보드 생성
   * ------------------------------------------------------------------ */
  function create(opts) {
    var root = opts.root || document;
    var tags = opts.tags || [];
    var MAX = opts.maxPoints || 300;
    var history = [];       // 표시 대상 샘플 (오래된 → 최신)
    var events = [];        // 알람 이벤트 (최신이 앞)
    var active = {};        // key → alarm
    var tagMap = {};
    tags.forEach(function (t) { tagMap[t.name] = t; });

    var $ = function (id) { return root.getElementById ? root.getElementById(id) : document.getElementById(id); };

    // ---- 그룹(차트) 계산: analog + counter, group 순서 유지 ----
    var groups = [];
    var gmap = {};
    tags.forEach(function (t) {
      if (t.kind === 'digital') return;
      if (!gmap[t.group]) { gmap[t.group] = { name: t.group, unit: t.unit, kind: t.kind, tags: [] }; groups.push(gmap[t.group]); }
      gmap[t.group].tags.push(t);
    });
    // 태그별 시리즈 색상 (그룹 내 순서)
    var colorOf = {};
    groups.forEach(function (g) { g.tags.forEach(function (t, i) { colorOf[t.name] = SERIES_VARS[i % SERIES_VARS.length]; }); });

    // ---- 공정(process) 순서 ----
    var processes = [];
    tags.forEach(function (t) { if (processes.indexOf(t.process) < 0) processes.push(t.process); });

    /* ---------- 정적 DOM 생성 (최초 1회) ---------- */
    function buildSkeleton() {
      var kp = $('kpiRoot');
      kp.innerHTML = processes.map(function (p) {
        return '<div class="process-block"><div class="process-name">' + esc(p) + '<\/div><div class="kpis">' +
          tags.filter(function (t) { return t.process === p; }).map(function (t) {
            return '<div class="kpi" id="kpi-' + t.name + '" style="border-left-color: var(' + (colorOf[t.name] || '--line') + ')">' +
              '<div class="label"><i style="background: var(' + (colorOf[t.name] || '--ink-3') + ')"><\/i>' + esc(t.label) + '<\/div>' +
              '<div class="num mono" id="kv-' + t.name + '">--<\/div>' +
              '<div class="foot" id="kf-' + t.name + '">' + footText(t) + '<\/div><\/div>';
          }).join('') + '<\/div><\/div>';
      }).join('');

      var ch = $('chartRoot');

<script>
/**
 * 리플레이 제어
 *  - 1초(÷속도)마다 cursor 를 1 증가시켜 대시보드에 샘플을 push
 *  - 알람은 AlarmTracker(게이트웨이와 동일 규칙)로 재계산
 */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var data = null, dash = null, tracker = null;
  var cursor = 0, playing = true, speed = 1, timer = null;

  function load() {
    if (window.__PLC_SAMPLES__) return Promise.resolve(window.__PLC_SAMPLES__);
    var n = parseInt(new URLSearchParams(location.search).get('sample') || '500', 10) || 500;
    return fetch('samples/sample-' + n + '.json').then(function (r) {
      if (!r.ok) throw new Error('샘플 파일을 불러오지 못했습니다 (' + r.status + ')');
      return r.json();
    });
  }

  load().then(function (d) {
    data = d;
    var n = d.samples.length;
    $('subtitle').textContent = '시뮬레이터 생성 데이터 · 1초 간격 ' + n + '건 · 태그 ' + d.tags.length + '개 · ' +
      PlcDashboard.fmtTime(d.samples[0].ts) + ' ~ ' + PlcDashboard.fmtTime(d.samples[n - 1].ts) + ' (UTC)';
    dash = PlcDashboard.create({ tags: d.tags, maxPoints: 300 });
    tracker = PlcDashboard.AlarmTracker(d.tags);
    seek(1);
    schedule();
  }).catch(function (err) { $('subtitle').textContent = String(err.message || err); });

  function schedule() {
    clearInterval(timer);
    if (!playing) return;
    timer = setInterval(function () {
      if (cursor >= data.samples.length) { setPlaying(false); return; }
      seek(cursor + 1);
    }, 1000 / speed);
  }
  function setPlaying(p) {
    playing = p;
    var b = $('btnPlay'); b.textContent = p ? '❚❚ 일시정지' : '▶ 재생'; b.setAttribute('aria-pressed', String(p));
    schedule();
  }
  /** cursor 를 to 로 이동. 뒤로 가면 처음부터 다시 재생성 */
  function seek(to) {
    if (to < cursor) { cursor = 0; tracker.reset(); dash.setHistory([]); dash.setAlarms([], []); }
    var evts = [];
    while (cursor < to) {
      cursor += 1;
      var s = data.samples[cursor - 1];
      dash.push(s);
      tracker.evaluate(s).forEach(function (a) { evts.push(a); });
    }
    evts.forEach(function (a) { dash.pushAlarm(a); });
    var n = data.samples.length;
    $('progressText').textContent = cursor + ' / ' + n;
    $('progressBar').style.width = (cursor / n * 100) + '%';
    dash.render();
  }

  $('btnPlay').addEventListener('click', function () { if (!playing && cursor >= data.samples.length) seek(1); setPlaying(!playing); });
  $('btnRestart').addEventListener('click', function () { seek(1); setPlaying(true); });
  $('btnEnd').addEventListener('click', function () { seek(data.samples.length); setPlaying(false); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () {
      speed = Number(b.dataset.speed);
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      schedule();
    });
  });
  document.addEventListener('keydown', function (e) { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('btnPlay').click(); } });
})();
</script>
